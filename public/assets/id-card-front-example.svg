<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300">
  <!-- Background -->
  <rect width="500" height="300" fill="#ffffff"/>
  
  <!-- Top Section -->
  <g transform="translate(20,10)">
    <!-- Left Emblem -->
    <g>
      <circle cx="40" cy="40" r="30" fill="none" stroke="#888" stroke-width="2"/>
      <circle cx="40" cy="40" r="20" fill="none" stroke="#888" stroke-width="2"/>
      <circle cx="40" cy="40" r="10" fill="none" stroke="#888" stroke-width="2"/>
      
      <!-- Flag -->
      <rect x="80" y="15" width="360" height="35" fill="#ffffff" stroke="#ddd"/>
      <rect x="80" y="15" width="360" height="11" fill="#ff9933"/>
      <rect x="80" y="39" width="360" height="11" fill="#ffffff"/>
      <rect x="80" y="63" width="360" height="11" fill="#138808"/>
      
      <!-- Ashoka Chakra -->
      <circle cx="260" cy="50" r="16" fill="none" stroke="#000080" stroke-width="2"/>
    </g>
  </g>
  
  <!-- Photo Placeholder -->
  <rect x="30" y="90" width="110" height="140" fill="#d1d5db" rx="6"/>
  <path d="M85,120 a35,35 0 1 1 0.1,0" fill="#9ca3af"/>
  <ellipse cx="85" cy="190" rx="45" ry="35" fill="#9ca3af"/>

  <!-- Details -->
  <rect x="160" y="100" width="170" height="18" fill="#e5e7eb" rx="3"/>
  <rect x="160" y="135" width="130" height="18" fill="#e5e7eb" rx="3"/>
  <rect x="160" y="170" width="200" height="18" fill="#e5e7eb" rx="3"/>

  <!-- QR Code -->
  <rect x="370" y="100" width="90" height="90" fill="#ffffff" stroke="#ddd" rx="3"/>
  <rect x="380" y="110" width="22" height="22" fill="#000"/>
  <rect x="428" y="110" width="22" height="22" fill="#000"/>
  <rect x="380" y="156" width="22" height="22" fill="#000"/>
  <rect x="395" y="127" width="50" height="35" fill="#000"/>
  <rect x="407" y="119" width="25" height="50" fill="#000"/>

  <!-- Bottom Section -->
  <text x="30" y="260" fill="#111827" font-size="20" font-family="Arial" font-weight="bold">XXXX XXXX XXXX</text>
  <rect x="30" y="270" width="440" height="13" fill="#e5e7eb" rx="3"/>

  <!-- Red Line -->
  <rect x="25" y="245" width="450" height="3" fill="#dc2626"/>
